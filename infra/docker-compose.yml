services:
  postgres:
    image: postgres:15-alpine
    container_name: tcmaster-postgres
    environment:
      POSTGRES_DB: tcmaster
      POSTGRES_USER: tcmaster
      POSTGRES_PASSWORD: tcmaster
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcmaster -d tcmaster"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: tcmaster-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tcmaster
      SPRING_DATASOURCE_USERNAME: tcmaster
      SPRING_DATASOURCE_PASSWORD: tcmaster
      JWT_SECRET: change-me-change-me-change-me-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: tcmaster-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
